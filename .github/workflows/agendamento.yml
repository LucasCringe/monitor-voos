name: Monitor Diario de Voos - Pipa

on:
  schedule:
    # Executa todos os dias às 09:00 e às 21:00 (Horário de Brasília)
    - cron: '0 12,0 * * *'
  workflow_dispatch: # Permite rodar manualmente no botão de teste a qualquer momento

jobs:
  executar-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4.2.2 # Patch com suporte nativo/atualizado

      - name: Configurar Python
        uses: actions/setup-python@v5.4.0 # Patch atualizado
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Executar o script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
